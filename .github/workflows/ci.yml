name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck setup.sh docker/*.sh tests/integration/*.sh scripts/*.sh
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
      - name: secret scan
        run: scripts/secret-scan.sh

  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build images
        run: |
          docker build -f docker/Dockerfile --target mcp -t mcpbox-mcp:local .
          docker build -f docker/Dockerfile --target workbench -t mcpbox-workbench:local .
      - name: token permission regression (P0)
        run: tests/integration/test-token-permissions.sh mcpbox-mcp:local
      - name: compose end-to-end
        run: tests/integration/test-compose.sh
